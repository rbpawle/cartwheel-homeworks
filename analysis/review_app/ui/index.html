<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartwheel trace review</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --line: #e3e0da; --ink: #23201c; --muted: #6f6a63;
    --user: #2f6f9f; --assistant: #2e7d5b; --tool: #8a6d3b; --write: #a4402f;
    --accent: #3d5afe; --suggest: #9a7bd0; --pass: #2e7d5b; --fail: #a4402f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  nav button { border: 1px solid var(--line); background: var(--panel); padding: 5px 10px; border-radius: 6px; cursor: pointer; margin-right: 4px; font-size: 13px; }
  nav button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .muted { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; padding: 1px 7px; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; background: #f4f2ee; margin-right: 4px; white-space: nowrap; }
  .badge.group-challenge { background: #f6e9e6; border-color: #e3c9c2; }
  .badge.group-coverage { background: #e9f1ec; border-color: #c6ddcf; }
  .badge.flag { background: #fdf3da; border-color: #e8d6a6; }
  main { display: none; padding: 16px; }
  main.active { display: block; }

  /* ---- review layout: list | conversation | margin notes ---- */
  /* #review is an id selector, so it must not set display outside .active or it
     would outrank `main { display: none }` and stay visible under every view. */
  main:not(.active) { display: none !important; }
  #review.active { display: grid; grid-template-columns: 280px minmax(0, 1fr) 280px; gap: 24px; align-items: start; }
  #list { position: sticky; top: 58px; max-height: calc(100vh - 74px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  #list .filters { padding: 8px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 4px; }
  .sec-head { padding: 7px 9px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line); }
  details.sec { border-top: 1px solid var(--line); }
  details.sec > summary { padding: 6px 9px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); cursor: pointer; }
  details.mode > summary { cursor: pointer; list-style: revert; }
  details.mode[open] > summary { border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 4px; }
  details.mode .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .lp { display: inline-block; font-size: 11px; font-variant-numeric: tabular-nums; padding: 0 5px; border-radius: 4px; border: 1px solid; }
  .lp-none { background: #f4f2ee; border-color: #d8d4cc; color: var(--muted); }
  .lp-part { background: #fdf3da; border-color: #e0c169; color: #7a5c12; }
  .lp-done { background: #e6f1e9; border-color: #9cc4ab; color: #2e7d5b; }
  .chip { display: inline-block; font-size: 11px; border: 1px solid var(--line); background: #eef1ff; border-radius: 999px; padding: 1px 7px; margin: 2px 3px 0 0; cursor: pointer; }
  .chip:hover { background: #dde3ff; }
  .chip.clear-all { background: #f4f2ee; }
  #f-ids { font-size: 12px; padding: 3px; border: 1px solid var(--line); border-radius: 4px; resize: vertical; font-family: ui-monospace, Menlo, monospace; }
  #d-table { font-size: 12px; margin: 4px 0; }
  #d-table th, #d-table td { padding: 2px 5px; }
  .judge { margin-top: 4px; padding: 5px 6px; border-radius: 4px; background: #faf9f7; border: 1px solid var(--line); }
  .judge.conflict { background: #fdf3da; border-color: #e0c169; }
  .jv { font-size: 11px; padding: 1px 5px; border-radius: 3px; border: 1px solid var(--line); margin-left: 4px; }
  .jv-pass { background: #e6f1e9; border-color: #9cc4ab; }
  .jv-fail { background: #f7e7e7; border-color: #cba3a3; }
  .jv-conflict { background: #f4e2c3; border-color: #d0a85a; }
  .critique { font-size: 12px; white-space: pre-wrap; margin-top: 3px; }
  button.on-rule { background: #e8e3f5; border-color: #a99ccd; }
  #list .filters select, #list .filters input { font-size: 12px; padding: 3px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  .row { padding: 7px 9px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 12px; }
  .row:hover { background: #f4f2ee; }
  .row.sel { background: #eef1ff; border-left: 3px solid var(--accent); }
  .row .sid { font-weight: 600; }
  .row .dot { float: right; font-size: 11px; }
  .conv { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .conv h2 { font-size: 16px; margin: 0 0 4px; }
  details.expected { margin: 12px 0 24px; border: 1px dashed var(--line); border-radius: 6px; padding: 8px 10px; background: #faf7f0; }
  details.expected summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  details.expected .outcome { font-weight: 600; font-family: ui-monospace, Menlo, monospace; margin-top: 6px; }
  .turn { margin-top: 32px; }
  .turn:first-of-type { margin-top: 16px; }
  .turn-head { font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 3px; margin-bottom: 12px; }
  .msg { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin-bottom: 16px; }
  .msg.user { border-color: var(--user); }
  .msg.assistant { border-color: var(--assistant); }
  .role { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .msg.user .role { color: var(--user); }
  .msg.assistant .role { color: var(--assistant); }
  .tool { border: 1px solid #e2d6bd; border-radius: 6px; background: #fdfaf3; margin-bottom: 16px; }
  .tool.write { border-color: #e6c3bb; background: #fdf5f3; }
  .tool .call { padding: 5px 9px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--tool); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .tool.write .call { color: var(--write); }
  .tool .args { flex: 1 1 100%; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .tool .result { border-top: 1px dashed #e2d6bd; padding: 4px 9px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .tool .result .status { font-weight: 700; }
  .tool .result .status.err { color: var(--write); }
  pre { margin: 4px 0 0; padding: 6px 8px; background: #f6f4ef; border-radius: 4px; overflow-x: auto; font-size: 12px; }
  .ann-mark { background: #fff3b0; border-bottom: 1px solid #e3c000; }
  #notes { position: sticky; top: 58px; }
  .note { border: 1px solid var(--line); border-left: 3px solid var(--accent); background: var(--panel); border-radius: 6px; padding: 7px 9px; margin-bottom: 8px; font-size: 12px; }
  .note.suggestion { border-left-style: dashed; border-left-color: var(--suggest); background: #faf7ff; }
  .note .quote { color: var(--muted); font-style: italic; margin-bottom: 4px; }
  .note .actions { margin-top: 5px; display: flex; gap: 6px; }
  button.small { font-size: 11px; padding: 2px 7px; border: 1px solid var(--line); background: #fff; border-radius: 4px; cursor: pointer; }
  #popover { position: absolute; z-index: 40; display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; width: 300px; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
  #popover textarea { width: 100%; height: 66px; border: 1px solid var(--line); border-radius: 4px; padding: 6px; font: inherit; font-size: 12px; }
  table { border-collapse: collapse; width: 100%; background: var(--panel); }
  th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; font-size: 13px; vertical-align: top; }
  th { background: #f4f2ee; font-size: 12px; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; cursor: pointer; font-size: 12px; background: #fff; }
  .pill.on-fail { background: #fbe9e6; border-color: var(--fail); color: var(--fail); font-weight: 600; }
  .pill.on-pass { background: #e9f1ec; border-color: var(--pass); color: var(--pass); font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .bar { height: 8px; background: #eceae5; border-radius: 4px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  details.exchange { margin: 6px 0 18px; border: 1px solid var(--line); border-radius: 6px; background: #f8f7f4; }
  details.exchange > summary { cursor: pointer; padding: 5px 9px; font-size: 12px; color: var(--muted); }
  .step { border-top: 1px solid var(--line); padding: 8px 10px; }
  .step .hd { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .step .side { margin: 4px 0 4px 8px; padding-left: 8px; border-left: 2px solid var(--line); }
  .step .side.req { border-color: #b9b3a7; }
  .step .side.res { border-color: var(--assistant); }
  .prov { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-left: 5px; background: #fff; }
  .prov.reconstructed { border-color: #c9b27a; color: #8a6d3b; background: #fdf8ec; }
  .prov.from_code { border-color: #a9a2d6; color: #5b53a0; background: #f4f2fb; }
  .copyid { font-family: ui-monospace, Menlo, monospace; font-size: 11px; cursor: pointer; border-bottom: 1px dotted var(--line); }
  .copyid:hover { background: #f4f2ee; }
  .callline { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--tool); }
  #confirm-pop { display: none; position: absolute; z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.12); padding: 8px; width: 240px; font-size: 12px; }
  #confirm-pop .actions { display: flex; gap: 6px; margin-top: 6px; }
  input[type=text], textarea, select { font: inherit; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 11px; background: #f6f4ef; }
</style>
</head>
<body>
<header>
  <h1>Cartwheel review</h1>
  <nav>
    <button data-view="review" class="active">Review</button>
    <button data-view="taxonomy">Taxonomy</button>
    <button data-view="labeling">Labeling</button>
    <button data-view="progress">Progress</button>
    <button data-view="suggestions">Suggestions</button>
  </nav>
  <span class="muted" id="meta"></span>
  <span class="muted" style="margin-left:auto"><kbd>j</kbd>/<kbd>k</kbd> next/prev · <kbd>e</kbd> expected · select text to annotate</span>
</header>

<main id="review" class="active">
  <div id="list">
    <div class="sec-head">sessions <span class="muted" id="showing"></span></div>
    <div class="filters">
      <select id="f-group"><option value="">group: all</option><option>coverage</option><option>challenge</option></select>
      <select id="f-role"><option value="">role: all</option><option>shopper</option><option>merchant</option><option>support</option></select>
      <select id="f-intent"><option value="">intent: all</option></select>
      <select id="f-state"><option value="">reviewed: all</option><option value="todo">unreviewed</option><option value="done">reviewed</option><option value="unlabeled">needs labels</option><option value="disagree">judge disagreements</option></select>
      <select id="f-judge" title="which judge version the disagreement filter and verdicts use"><option value="">judge: latest</option></select>
      <input id="f-text" type="text" placeholder="search text" size="12">
      <textarea id="f-ids" placeholder="paste scenario ids (comma, tab, or line separated)" rows="2" style="flex-basis:100%"></textarea>
      <span class="muted" id="f-ids-note" style="flex-basis:100%"></span>
      <div id="chips" style="flex-basis:100%"></div>
    </div>

    <details class="sec">
      <summary>draw a batch</summary>
      <div class="filters">
        <span class="muted" style="flex-basis:100%">by strategy</span>
        <select id="s-strategy" title="selection strategy">
          <option value="diversity">diversity</option>
          <option value="random">random</option>
          <option value="outlier">outlier</option>
        </select>
        <input id="s-k" type="number" min="1" max="100" value="15" style="width:52px" title="batch size">
        <button class="small" id="s-run">draw</button>
        <span class="muted" id="s-note" style="flex-basis:100%"></span>
      </div>
      <div class="filters" style="border-top:0">
        <span class="muted" style="flex-basis:100%">by dimension</span>
        <select id="d-dim" style="flex:1" title="stratify a batch across one dimension's values">
          <option value="">stratify by…</option>
        </select>
        <span class="muted" id="d-note" style="flex-basis:100%"></span>
        <table id="d-table" hidden></table>
        <button class="small" id="d-draw" hidden style="flex-basis:100%">draw and filter</button>
      </div>
      <div class="filters" style="border-top:0">
        <span class="muted" style="flex-basis:100%">by failure mode</span>
        <select id="c-mode" style="flex:1" title="grow the labeling pool for one registered failure mode">
          <option value="">mode…</option>
        </select>
        <select id="c-strategy" title="enrich: neighbors of the confirmed failures · random: uniform">
          <option value="enrich">enrich</option>
          <option value="random">random</option>
        </select>
        <input id="c-k" type="number" min="1" max="100" value="20" style="width:52px" title="how many candidates">
        <button class="small" id="c-run">find</button>
        <span class="muted" id="c-note" style="flex-basis:100%"></span>
      </div>
      <div class="filters" style="border-top:0">
        <span class="muted" style="flex-basis:100%">from what is showing now</span>
        <input id="b-name" type="text" placeholder="batch name" style="flex:1">
        <button class="small" id="b-save">save as batch</button>
      </div>
    </details>

    <details class="sec">
      <summary>saved batches</summary>
      <div class="filters">
        <select id="s-saved" style="flex:1" title="saved sample sets"><option value="">saved batches…</option></select>
        <button class="small" id="s-rename" title="rename the selected batch">✎</button>
        <button class="small" id="s-trash" title="delete the selected batch">🗑</button>
      </div>
    </details>
    <div id="confirm-pop"></div>
    <div id="rows"></div>
  </div>
  <div class="conv" id="conv"></div>
  <div id="notes"></div>
</main>

<main id="taxonomy">
  <div class="card">
    <b>Failure modes</b> <span class="muted">binary; a mode becomes “final” when status = confirmed</span>
    <div id="modes"></div>
    <div class="actions" style="margin-top:8px">
      <input id="new-mode" type="text" placeholder="new mode name, e.g. unnecessary_escalation" style="flex:1">
      <button class="small" id="add-mode">create mode</button>
    </div>
  </div>
  <div class="card">
    <b>Annotations</b> <span class="muted" id="ann-count"></span>
    <div class="filters" style="border:0; padding:6px 0">
      <input id="a-text" type="text" placeholder="search notes" size="18">
      <select id="a-group"><option value="">group: all</option><option>coverage</option><option>challenge</option></select>
      <select id="a-role"><option value="">role: all</option><option>shopper</option><option>merchant</option><option>support</option></select>
      <select id="a-mode"><option value="">mode: all</option><option value="__none">unlinked</option></select>
    </div>
    <div style="overflow:auto; max-height:70vh"><table id="ann-table"></table></div>
  </div>
</main>

<main id="progress"></main>
<main id="suggestions"></main>

<div id="popover">
  <div class="muted" id="pop-quote"></div>
  <textarea id="pop-note" placeholder="What went wrong here? Describe the failure in your own words."></textarea>
  <div style="display:flex;gap:6px;margin-top:6px">
    <button class="small" id="pop-save">save</button>
    <button class="small" id="pop-copy" title="copy the highlighted text">copy</button>
    <button class="small" id="pop-cancel">cancel</button>
    <span class="muted" style="margin-left:auto">first failure only</span>
  </div>
</div>

<script>
const S = { sessions: [], current: null, annotations: [], patterns: {modes: []}, suggestions: [], labels: {}, progress: null, meta: {}, sel: null };
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = (path, body) => fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : undefined).then(r => r.json());

async function boot() {
  [S.meta, S.sessions, S.annotations, S.patterns, S.suggestions, S.labels, S.progress] = await Promise.all([
    api("/api/meta"), api("/api/sessions"), api("/api/annotations").then(d => d.annotations),
    api("/api/patterns"), api("/api/suggestions"), api("/api/labels"), api("/api/progress")]);
  [S.judges, S.rulings] = await Promise.all([api("/api/judges"), api("/api/rulings")]);
  renderJudgeOptions();
  $("#meta").textContent = `${S.meta.sessions} sessions · ${S.meta.traces} traces · ${S.meta.source}` + (S.meta.write_scores ? " · scores on" : " · scores off");
  const intents = [...new Set(S.sessions.map(s => s.intent))].filter(Boolean).sort();
  $("#f-intent").innerHTML = `<option value="">intent: all</option>` + intents.map(i => `<option>${i}</option>`).join("");
  renderModeOptions();
  await loadSaved();
  await loadDimensions();
  renderRows();
  const params = new URLSearchParams(location.search);
  const wanted = params.get("session")
    || (params.get("scenario") && (S.sessions.find(s => s.scenario_id === params.get("scenario")) || {}).session_id);
  if (wanted && S.sessions.some(s => s.session_id === wanted)) {
    select(wanted);
  } else if (S.sessions.length) {
    select(S.sessions[0].session_id);
  }
  const view = params.get("view");
  show(["taxonomy", "labeling", "progress", "suggestions"].includes(view) ? view : "review");

  // Trace ids can arrive by editing a mode's boxes, so bring annotation links up to date
  // at startup too; a card that is already saved has no enabled button to click.
  const before = JSON.stringify((S.patterns.modes || []).map(m => m.annotation_ids || []));
  reconcileAll();
  if (JSON.stringify((S.patterns.modes || []).map(m => m.annotation_ids || [])) !== before) {
    S.patterns = await api("/api/patterns", S.patterns);
    renderAnnotationTable();
  }
}

/* ------------------------------------------------------------------ list */
function annotatedIds() { return new Set(S.annotations.map(a => a.session_id)); }
/* Accepts "support-0123", bare numbers, and any mix of commas, tabs, spaces, newlines. */
function idFilter() {
  const raw = $("#f-ids").value.trim();
  if (!raw) { $("#f-ids-note").textContent = ""; return null; }
  const known = new Set(S.sessions.map(s => s.scenario_id));
  const wanted = new Set(), missing = [];
  raw.split(/[\s,;]+/).filter(Boolean).forEach(token => {
    const id = /^\d+$/.test(token) ? "support-" + token.padStart(4, "0") : token;
    if (known.has(id)) wanted.add(id); else missing.push(token);
  });
  $("#f-ids-note").textContent = `${wanted.size} matched` + (missing.length ? ` · not found: ${missing.slice(0, 5).join(", ")}${missing.length > 5 ? "…" : ""}` : "");
  return wanted;
}
function filtered() {
  const g = $("#f-group").value, r = $("#f-role").value, i = $("#f-intent").value, st = $("#f-state").value, t = $("#f-text").value.toLowerCase();
  const ids = idFilter();
  const done = annotatedIds();
  return S.sessions.filter(s =>
    (!ids || ids.has(s.scenario_id)) &&
    (!S.sample || S.sample.ids.has(s.session_id)) &&
    (!g || s.scenario_group === g) && (!r || s.role === r) && (!i || s.intent === i) &&
    (!st || (st === "unlabeled" ? labelProgress(s).done < labelProgress(s).total
           : st === "disagree" ? sessionDisagrees(s)
                                 : (st === "done") === done.has(s.session_id))) &&
    (!t || (s.opening + " " + s.scenario_id).toLowerCase().includes(t)));
}

/* ------------------------------------------------------- sampling + copy */
$("#s-run").onclick = async () => {
  const strategy = $("#s-strategy").value, k = +$("#s-k").value;
  $("#s-note").textContent = "sampling…";
  const res = await api("/api/sample", {strategy, k, exclude_reviewed: true});
  if (res.error) { $("#s-note").textContent = "sampling failed — see server log"; return; }
  S.sample = {name: res.batch_name, ids: new Set(res.sessions.map(s => s.session_id)),
              reasons: Object.fromEntries(res.sessions.map(s => [s.session_id, s.reason]))};
  await loadSaved(res.batch_name);
  applyBatch(res.batch_name);
  await loadDimensions(); renderDimension();
  refreshProgress();
};

/* Candidates for one failure mode (Homework 5, Part A). next_to_label runs locally over
   the recorded trace source, so this returns in well under a second and needs no
   progress reporting beyond the button's own disabled state. */
function renderModeOptions() {
  const select = $("#c-mode"), current = select.value;
  const modes = finalModes().map(m => m.name);
  select.innerHTML = `<option value="">mode…</option>`
    + modes.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  if (modes.includes(current)) select.value = current;
}
$("#c-run").onclick = async () => {
  const mode = $("#c-mode").value, strategy = $("#c-strategy").value, k = +$("#c-k").value;
  if (!mode) { $("#c-note").textContent = "pick a failure mode first"; return; }
  const button = $("#c-run");
  button.disabled = true;
  $("#c-note").textContent = "finding…";
  try {
    const res = await api("/api/sample/candidates", {mode, strategy, k, exclude_batched: true});
    if (res.error) { $("#c-note").textContent = res.error.split("\n").pop().slice(0, 120); return; }
    S.sample = {name: res.batch_name, ids: new Set(res.sessions.map(s => s.session_id)),
                reasons: Object.fromEntries(res.sessions.map(s => [s.session_id, s.reason]))};
    await loadSaved(res.batch_name);
    applyBatch(res.batch_name);
    await loadDimensions(); renderDimension();
    refreshProgress();
    $("#c-note").textContent = `${res.batch_name}: ${res.found} of ${res.requested} requested`;
  } finally {
    button.disabled = false;
  }
};

/* saved sample sets: read from sample_manifest.json, applied as the sidebar filter */
function stamp(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString(undefined, {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"});
}
async function loadSaved(selectName) {
  const manifest = await api("/api/manifest");
  S.batches = manifest.batches || {};
  const names = Object.keys(S.batches).sort((a, b) =>
    (S.batches[b].selected_at || "").localeCompare(S.batches[a].selected_at || ""));
  const inAny = new Set();
  names.forEach(n => (S.batches[n].sessions || []).forEach(x => inAny.add(x.session_id)));
  $("#s-saved").innerHTML = `<option value="">saved batches…</option>`
    + (names.length ? `<option value="__all">all batches · ${inAny.size} sessions</option>
                       <option value="__none">not in any batch · ${S.sessions.length - inAny.size}</option>` : "")
    + names.map(n => {
        const b = S.batches[n];
        return `<option value="${esc(n)}">${esc(n)} · ${esc(stamp(b.selected_at))} · ${(b.sessions || []).length}</option>`;
      }).join("");
  if (selectName && S.batches[selectName]) $("#s-saved").value = selectName;
}
function applyBatch(name) {
  // pseudo-batches: every session that belongs to some batch, or none of them
  if (name === "__all" || name === "__none") {
    const inAny = new Set();
    Object.values(S.batches).forEach(b => (b.sessions || []).forEach(x => inAny.add(x.session_id)));
    const wanted = S.sessions.filter(s => inAny.has(s.session_id) === (name === "__all"));
    const reasons = {};
    Object.entries(S.batches).forEach(([n, b]) => (b.sessions || []).forEach(x => {
      reasons[x.session_id] = `${n}: ${x.reason || ""}`;
    }));
    S.sample = {name: name === "__all" ? "all batches" : "not in any batch",
                ids: new Set(wanted.map(s => s.session_id)),
                reasons: name === "__all" ? reasons : {}};
    $("#s-note").textContent = `${S.sample.name}: ${wanted.length} sessions`;
    renderRows();
    const first = filtered()[0];
    if (first) select(first.session_id);
    return;
  }
  const b = S.batches[name];
  if (!b) { S.sample = null; $("#s-note").textContent = ""; renderRows(); return; }
  S.sample = {name, ids: new Set(b.sessions.map(s => s.session_id)),
              reasons: Object.fromEntries(b.sessions.map(s => [s.session_id, s.reason]))};
  $("#s-note").textContent = `${name}: ${b.sessions.length} sessions · drawn ${stamp(b.selected_at)}`;
  renderRows();
  const first = filtered()[0];
  if (first) select(first.session_id);
}

      <details><summary class="muted">system prompt (${ex.system_prompt.length} chars)${ex.system_prompt_varies ? " — differs between steps" : ""}</summary>

        ${(s.response.tool_calls || []).map(c => `<div class="callline">→ ${esc(c.name)} ${esc(JSON.stringify(c.arguments || {}))}</div>`).join("")}
      </div>
    </div>`).join("")}
    <div class="step muted">Responses marked <span class="prov reconstructed">reconstructed</span> are recovered from the next step's request; the instrumentation did not store generation outputs. Output tokens and cost were not recorded.</div>
  </details>`;
}
function renderBlock(b, traceId, idx) {
  if (b.kind === "tool") {
    const res = b.result === null ? `<div class="result muted">no result recorded</div>` : `
      <div class="result">
        <span class="status ${String(b.status).match(/denied|error|not_|invalid|paused/) ? "err" : ""}">${esc(b.status)}</span>
        <details><summary class="muted">result json</summary><pre class="anno" data-trace="${traceId}" data-idx="${idx}">${esc(JSON.stringify(b.result, null, 1))}</pre></details>

    return `<div class="tool ${b.write ? "write" : ""}">

/* -------------------------------------------------------- annotations */
function bindSelection() {
  document.querySelectorAll(".anno").forEach(el => {
    el.onmouseup = () => {
      const sel = window.getSelection();
      const text = String(sel).trim();
      if (!text) return;
      const range = sel.getRangeAt(0);
      const rect = range.getBoundingClientRect();
      // Keep the selection visible while the textarea has focus (the browser drops the
      // native highlight), so the quote stays readable and copyable.
      try {
        const mark = document.createElement("mark");
        mark.className = "ann-mark tmp-hl";
        range.surroundContents(mark);
        sel.removeAllRanges();
      } catch (e) { /* selection spans elements; keep the native highlight */ }
      S.sel = {trace_id: el.dataset.trace, block_index: el.dataset.idx, quote: text};
      const pop = $("#popover");
      pop.style.display = "block";
      pop.style.top = (window.scrollY + rect.bottom + 6) + "px";
      pop.style.left = Math.min(window.scrollX + rect.left, window.innerWidth - 320) + "px";
      $("#pop-quote").textContent = text.length > 90 ? text.slice(0, 90) + "…" : text;
      $("#pop-note").value = "";
      $("#pop-note").focus();
    };
  });
}
function closePopover() {
  $("#popover").style.display = "none";
  S.sel = null;
  document.querySelectorAll("mark.tmp-hl").forEach(mark => {
    const parent = mark.parentNode;
    while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
    parent.removeChild(mark);
    parent.normalize();
  });
}
$("#pop-cancel").onclick = closePopover;
$("#pop-note").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#pop-save").click(); }
});
$("#pop-copy").onclick = async () => {

  try { await navigator.clipboard.writeText(S.sel.quote); } catch (e) { /* clipboard blocked */ }
  const b = $("#pop-copy"); b.textContent = "copied";
  setTimeout(() => { b.textContent = "copy"; }, 1000);
};
// Click away or press Escape to dismiss, so cancel is never the only way out.
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-copy]");
  if (!el) return;
  e.preventDefault();
  const value = el.dataset.copy, shown = el.textContent;
  try { await navigator.clipboard.writeText(value); } catch (err) { /* clipboard blocked */ }
  el.textContent = "copied";
  setTimeout(() => { el.textContent = shown; }, 900);
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#popover").style.display === "block") closePopover();
  // Cmd/Ctrl+C copies the quoted text while the popover is open. The native selection is
  // gone by then (focus sits in the textarea), so copy the stored quote instead — unless
  // the reviewer has selected something inside the textarea itself.
  if ((e.metaKey || e.ctrlKey) && e.key === "c" && S.sel && $("#popover").style.display === "block") {
    const ta = $("#pop-note");
    if (document.activeElement === ta && ta.selectionStart !== ta.selectionEnd) return;
    e.preventDefault();

    <button class="small" id="no-failure" style="margin-top:4px">record “no failure observed”</button>`;
  $("#no-failure").onclick = async () => {
    const saved = await api("/api/annotations", {session_id: S.session.session_id, scenario_id: S.session.scenario_id,
      trace_id: S.session.trace_ids[0], quote: "", note: "no failure observed"});
    S.annotations.push(saved); renderNotes(); renderRows(); refreshProgress();
  };
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    const id = b.dataset.edit;
    const target = document.querySelector(`[data-note="${id}"]`);
    const current = S.annotations.find(a => a.annotation_id === id);
    if (!target || !current || target.querySelector("textarea")) return;
    target.innerHTML = `<textarea style="width:100%;height:60px">${esc(current.note)}</textarea>
      <div class="actions"><button class="small" data-save="${id}">save</button>
        <button class="small" data-cancel="${id}">cancel</button></div>
      <div class="muted">enter saves · shift+enter for a new line · esc cancels</div>`;
    const box = target.querySelector("textarea");
    box.focus(); box.selectionStart = box.value.length;
    const save = async () => {
      const note = box.value.trim();
      if (!note) return;
      const saved = await api("/api/annotations", {...current, note});
      S.annotations = S.annotations.map(a => a.annotation_id === id ? saved : a);
      renderNotes(); renderRows(); renderAnnotationTable(); refreshProgress();
    };
    box.onkeydown = e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); save(); }
      if (e.key === "Escape") { e.preventDefault(); renderNotes(); }
    };
    target.querySelector("[data-save]").onclick = save;
    target.querySelector("[data-cancel]").onclick = () => renderNotes();
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const d = await api("/api/annotations/delete", {annotation_id: b.dataset.del});
    S.annotations = d.annotations; renderNotes(); renderRows(); refreshProgress();
  });
  document.querySelectorAll("[data-acc],[data-rej]").forEach(b => b.onclick = async () => {
    const accept = b.hasAttribute("data-acc");
    await api("/api/suggestions/accept", {suggestion_id: accept ? b.dataset.acc : b.dataset.rej, decision: accept ? "accepted" : "rejected"});
    [S.suggestions, S.annotations] = await Promise.all([api("/api/suggestions"), api("/api/annotations").then(d => d.annotations)]);
    renderNotes(); renderSuggestions(); renderRows();
  });
}

/* ------------------------------------------------------------ taxonomy */
function modeSummary(m) {
  const pos = (m.example_trace_ids || []).length, neg = (m.close_negative_trace_ids || []).length;
  const notes = (m.annotation_ids || []).length;
  const warn = [];
  if (!m.definition) warn.push("no definition");
  if (!m.requirement_source) warn.push("no requirement");
  if (pos < 3) warn.push(`${pos}/3 positives`);
  return `<b>${esc(m.name || "(unnamed)")}</b>
    <span class="badge">${esc(m.status || "draft")}</span>
    <span class="muted">${pos} positive · ${neg} close neg · ${notes} notes</span>
    ${warn.length ? `<span class="badge flag">${esc(warn.join(" · "))}</span>` : ""}`;
}
function reconcileAnnotationLinks(mode) {
  /* Keep the two directions in step: a trace id typed into the positive or close-negative
     box links every annotation written on that trace, and a trace id removed from both
     boxes unlinks them. Trace ids with no annotation stay in the list untouched, since the
     fields are also meant for traces that were never annotated. */
  const ids = new Set([...(mode.example_trace_ids || []), ...(mode.close_negative_trace_ids || [])]);
  const linked = new Set(mode.annotation_ids || []);
  S.annotations.forEach(a => {
    if (!a.trace_id) return;
    if (ids.has(a.trace_id)) linked.add(a.annotation_id);
    else linked.delete(a.annotation_id);
  });
  mode.annotation_ids = [...linked];
}
function renderTaxonomy() {
  const modes = S.patterns.modes || [];
  S.openModes = S.openModes || new Set();
  // Unsaved edits live here, keyed by the mode's saved name, so re-rendering after a
  // save on one card restores the others' in-progress text instead of wiping it.
  S.pending = S.pending || {};
  $("#modes").innerHTML = modes.map((m, i) => `
    <details class="mode card" data-mode-card="${i}" ${S.openModes.has(m.name) ? "open" : ""}>
      <summary>${modeSummary(m)}</summary>
      <div class="grid2" style="margin-top:8px">
        <label>name<br><input type="text" data-m="${i}" data-k="name" value="${esc(m.name || "")}" style="width:100%"></label>
        <label>status<br><select data-m="${i}" data-k="status">${["draft","confirmed","frozen"].map(x => `<option ${m.status === x ? "selected" : ""}>${x}</option>`).join("")}</select></label>
      </div>
      <label>binary definition<br><textarea data-m="${i}" data-k="definition" style="width:100%;height:48px">${esc(m.definition || "")}</textarea></label>
      <div class="grid2">
        <label>requirement source<br><input type="text" data-m="${i}" data-k="requirement_source" value="${esc(m.requirement_source || "")}" style="width:100%" placeholder="RESP-2, or a recorded spec revision"></label>
        <label>evaluator type<br><select data-m="${i}" data-k="evaluator_type">${["judge","code"].map(x => `<option ${m.evaluator_type === x ? "selected" : ""}>${x}</option>`).join("")}</select></label>
      </div>
      <label>boundary vs nearest mode<br><textarea data-m="${i}" data-k="boundary" style="width:100%;height:38px">${esc(m.boundary || "")}</textarea></label>
      <div class="grid2">
        <label>positive trace ids<br><input type="text" data-m="${i}" data-k="example_trace_ids" value="${esc((m.example_trace_ids || []).join(", "))}" style="width:100%"></label>
        <label>close negative trace ids<br><input type="text" data-m="${i}" data-k="close_negative_trace_ids" value="${esc((m.close_negative_trace_ids || []).join(", "))}" style="width:100%"></label>
      </div>
      <div class="muted" style="margin-top:6px">supporting annotations: ${
        (() => { const n = S.annotations.filter(a => (m.annotation_ids || []).includes(a.annotation_id));
                 return n.length ? n.map(x => esc(x.note.slice(0, 60))).join(" | ")
                                 : "none yet — link them in the annotations table below"; })()}</div>
      <div class="actions" style="margin-top:8px">
        <button class="small" data-update="${i}" disabled>update mode</button>
        <span class="muted" data-dirty="${i}"></span>
        <span style="margin-left:auto"></span>
        <button class="small" data-rm="${i}">remove mode</button>
      </div>
    </details>`).join("") || `<div class="muted">no modes yet</div>`;

  // restore staged edits and their dirty state after the re-render
  modes.forEach((m, i) => {
    const pending = S.pending[m.name];
    if (!pending) return;
    Object.entries(pending).forEach(([k, v]) => {
      const el = document.querySelector(`#modes [data-m="${i}"][data-k="${k}"]`);
      if (el) el.value = v;
    });
    const btn = document.querySelector(`#modes [data-update="${i}"]`);
    if (btn) btn.disabled = false;
    const note = document.querySelector(`#modes [data-dirty="${i}"]`);
    if (note) note.textContent = "unsaved changes";
    S.openModes.add(m.name);
    const card = document.querySelector(`#modes [data-mode-card="${i}"]`);
    if (card) card.open = true;
  });

  // remember which cards are open across re-renders
  document.querySelectorAll("#modes details").forEach((d, i) => d.ontoggle = () => {
    const name = (S.patterns.modes[i] || {}).name;
    if (!name) return;
    d.open ? S.openModes.add(name) : S.openModes.delete(name);
  });

  // edits are staged; "update mode" commits them
  document.querySelectorAll("#modes [data-m]").forEach(el => el.oninput = () => {
    const i = el.dataset.m, name = (S.patterns.modes[+i] || {}).name;
    if (name) {
      S.pending[name] = S.pending[name] || {};
      S.pending[name][el.dataset.k] = el.value;
    }
    const btn = document.querySelector(`#modes [data-update="${i}"]`);
    if (btn) btn.disabled = false;
    const note = document.querySelector(`#modes [data-dirty="${i}"]`);
    if (note) note.textContent = "unsaved changes";
  });

  document.querySelectorAll("#modes [data-update]").forEach(btn => btn.onclick = () => {
    const i = +btn.dataset.update, mode = S.patterns.modes[i], was = mode.name;
    document.querySelectorAll(`#modes [data-m="${i}"]`).forEach(el => {
      const k = el.dataset.k;
      mode[k] = k.endsWith("trace_ids") ? el.value.split(/[\s,;]+/).filter(Boolean) : el.value;
    });
    reconcileAnnotationLinks(mode);
    delete S.pending[was];           // this card is saved; others keep their staged edits
    S.openModes.delete(was);
    S.openModes.add(mode.name);
    savePatterns();
  });

  document.querySelectorAll("#modes [data-rm]").forEach(btn => btn.onclick = () => {
    const i = +btn.dataset.rm, mode = S.patterns.modes[i];
    const row = btn.closest(".actions");
    row.innerHTML = `<span>Delete <b>${esc(mode.name || "(unnamed)")}</b>? Its annotations stay; only the mode is removed.</span>
      <button class="small" data-yes="1">delete</button><button class="small" data-no="1">cancel</button>`;
    row.querySelector("[data-no]").onclick = () => renderTaxonomy();
    row.querySelector("[data-yes]").onclick = () => {
      S.openModes.delete(mode.name);
      delete S.pending[mode.name];
      S.patterns.modes.splice(i, 1);
      savePatterns();
    };
  });
}
/* Supporting annotations: every open code, with the scenario's characteristics, and a

        <td>${esc(s.role || "")}<div class="muted">${esc(s.intent || "")}${s.difficulty ? " · " + esc(s.difficulty) : ""}</div></td>
        <td>${s.scenario_group ? `<span class="badge group-${s.scenario_group}">${s.scenario_group}</span>` : ""}
          ${s.data_quality_case_id ? `<div class="muted">${esc(s.data_quality_case_id)}</div>` : ""}</td>
        <td>${esc(a.note)}</td>
        <td class="muted">${a.quote ? "“" + esc(a.quote.slice(0, 60)) + "”" : ""}</td>
        <td>${names.map(n => {
            const m = modes.find(x => x.name === n) || {};
            const side = (m.close_negative_trace_ids || []).includes(a.trace_id) ? "close neg" : "positive";
            return `<span class="badge">${esc(n)} · ${side} <a href="#" data-unlink="${a.annotation_id}" data-mode="${esc(n)}">×</a></span>`;

          ${modes.length ? `<select data-link="${a.annotation_id}"><option value="">link…</option>${
            modes.map(m => `<option value="${esc(m.name)}|pos">${esc(m.name)} — positive</option>
                            <option value="${esc(m.name)}|neg">${esc(m.name)} — close negative</option>`).join("")}</select>` : ""}</td>
      </tr>`;
    }).join("")}</tbody>`;

  document.querySelectorAll("#ann-table [data-link]").forEach(el => el.onchange = () => {

async function savePatterns() {

/* ------------------------------------------------------------ labeling */
/* ------------------------------------------------- judge verdicts (HW5 C) */
/* Verdicts arrive from /api/judges already converted to the review app's
   convention (1 = failure present), so they compare directly with a human label. */
function activeJudge(mode) {
  const versions = ((S.judges || {}).modes || {})[mode] || [];
  if (!versions.length) return null;
  const wanted = (S.judgeVersion || {})[mode];
  return versions.find(j => j.judge_id === wanted) || versions[versions.length - 1];
}
/* One selector across every mode that has judges. Each option names a single
   judge_id, so picking one pins that mode and leaves the others on their latest
   version -- comparing v0 and v1 of the same mode is the point, and a global
   "version 1" would be meaningless once two modes have different version counts. */
function renderJudgeOptions() {
  const byMode = (S.judges || {}).modes || {};
  const groups = Object.entries(byMode).filter(([, v]) => v.length);
  $("#f-judge").innerHTML = `<option value="">judge: latest</option>`
    + groups.map(([mode, versions]) => `<optgroup label="${esc(mode)}">`
        + versions.map(j => `<option value="${esc(j.judge_id)}">${esc(j.judge_id)}`
            + `${j.status === "frozen" ? " (frozen)" : ""} · ${Object.keys(j.traces).length} scored</option>`).join("")
      + `</optgroup>`).join("");
  const current = Object.values(S.judgeVersion || {})[0];
  if (current) $("#f-judge").value = current;
}
$("#f-judge").onchange = () => {
  const judgeId = $("#f-judge").value;
  S.judgeVersion = {};
  if (judgeId) {
    for (const [mode, versions] of Object.entries((S.judges || {}).modes || {})) {
      if (versions.some(j => j.judge_id === judgeId)) S.judgeVersion[mode] = judgeId;
    }
  }
  renderRows(); renderRail();
};
function judgeVerdict(mode, traceId) {
  const judge = activeJudge(mode);
  const hit = judge && judge.traces[traceId];
  return hit ? {judge, ...hit} : null;
}
function rulingFor(judgeId, traceId) {
  return ((S.rulings || {}).rulings || []).find(
    r => r.judge_id === judgeId && r.trace_id === traceId) || null;
}
/* A disagreement is only meaningful once the human has labelled the trace, so an
   unlabelled trace is never counted as one. */
function disagrees(mode, traceId) {
  const v = judgeVerdict(mode, traceId);
  if (!v) return false;
  const row = (S.labels[mode] || []).find(r => r.trace_id === traceId);
  return !!row && row.label !== v.verdict;
}
/* A trace that has been ruled on stays in the filter even once the disagreement is
   resolved. Fixing a label removes the conflict, and dropping the session from the
   list at that moment hides the work just done and makes the remaining count jump. */
function sessionDisagrees(session) {
  return finalModes().some(m => (session.trace_ids || []).some(t => {
    if (disagrees(m.name, t)) return true;
    const judge = activeJudge(m.name);
    return !!judge && !!rulingFor(judge.judge_id, t);
  }));
}
const RULINGS = [["judge_wrong", "judge wrong"], ["label_wrong", "my label wrong"],
                 ["definition_unclear", "definition unclear"]];
function judgeBlock(mode, traceId, humanLabel) {
  const v = judgeVerdict(mode, traceId);
  if (!v) return "";
  const conflict = humanLabel !== null && humanLabel !== v.verdict;
  const ruled = rulingFor(v.judge.judge_id, traceId);
  return `<div class="judge ${conflict ? "conflict" : ""}">
    <div>
      <span class="muted">${esc(v.judge.judge_id)}${v.split ? " · " + v.split : ""}</span>
      <span class="jv ${v.verdict === 1 ? "jv-fail" : "jv-pass"}">judge: ${v.verdict === 1 ? "Fail" : "Pass"}</span>
      ${conflict ? `<span class="jv jv-conflict">disagrees</span>` : ""}
    </div>
    ${v.critique ? `<details style="margin-top:4px"><summary class="muted">critique</summary>
      <div class="critique">${esc(v.critique)}</div></details>` : ""}
    ${conflict || ruled ? `<div class="actions" style="margin-top:4px">
      ${RULINGS.map(([key, text]) => `<button class="small ${ruled && ruled.ruling === key ? "on-rule" : ""}"
          data-rule="${key}" data-rt="${traceId}" data-rj="${esc(v.judge.judge_id)}"
          data-rm="${esc(mode)}">${text}</button>`).join("")}
      ${ruled ? `<div class="muted" style="margin-top:3px">ruled: ${esc(ruled.ruling)}${ruled.note ? " — " + esc(ruled.note) : ""}${conflict ? "" : " · resolved"}</div>` : ""}
    </div>` : ""}
  </div>`;
}

function renderLabelRail() {
  const modes = finalModes(), s = S.session;
  if (!s) { $("#notes").innerHTML = `<div class="muted">pick a session</div>`; return; }
  if (!modes.length) {
    $("#notes").innerHTML = `<div class="muted">no confirmed modes yet — add them in the Taxonomy view,
      then set a mode's status to <b>confirmed</b> to label against it.</div>`;
    return;
  }
  const notes = S.annotations.filter(a => a.session_id === S.current);
  const p = labelProgress(s);
  $("#notes").innerHTML = `
    <div class="muted" style="margin-bottom:6px">${p.done} of ${p.total} judgments · ${modes.length} mode(s)</div>
    ${s.trace_ids.map((tid, i) => `<div class="note" style="border-left-color:var(--tool)">
        <div class="muted">turn ${i + 1} · <span class="copyid" data-copy="${tid}" title="click to copy">${tid.slice(0, 12)}…</span></div>
        ${modes.map(m => {
          const row = (S.labels[m.name] || []).find(r => r.trace_id === tid);
          const v = row ? row.label : null;
          return `<div style="margin-top:5px">
            <div>${esc(m.name)}</div>
            <button class="pill ${v === 1 ? "on-fail" : ""}" data-t="${tid}" data-m="${esc(m.name)}" data-v="1">Fail</button>
            <button class="pill ${v === 0 ? "on-pass" : ""}" data-t="${tid}" data-m="${esc(m.name)}" data-v="0">Pass</button>
            ${judgeBlock(m.name, tid, v)}
          </div>`;
        }).join("")}
      </div>`).join("")}
    <details style="margin-top:8px"><summary class="muted">my annotations (${notes.length})</summary>
      ${notes.map(a => `<div class="note" style="margin-top:6px">${esc(a.note)}</div>`).join("") || `<div class="muted">none</div>`}
    </details>
    <div class="muted" style="margin-top:8px">press <kbd>e</kbd> for the expected result · <kbd>j</kbd>/<kbd>k</kbd> to move on</div>`;

  $("#notes").querySelectorAll(".pill").forEach(b => b.onclick = async () => {
    const res = await api("/api/labels", {mode: b.dataset.m, trace_id: b.dataset.t, label: +b.dataset.v});
    if (res.score_error) alert("saved locally, Langfuse score failed:\n" + res.score_error);
    S.labels = await api("/api/labels");
    renderLabelRail(); renderRows(); refreshProgress();
  });
  $("#notes").querySelectorAll("[data-rule]").forEach(b => b.onclick = async () => {
    const existing = rulingFor(b.dataset.rj, b.dataset.rt);
    const same = existing && existing.ruling === b.dataset.rule;
    const note = same ? "" : (prompt("Why? (optional)", existing ? existing.note : "") ?? "");
    S.rulings = await api("/api/rulings", {
      trace_id: b.dataset.rt, judge_id: b.dataset.rj, mode: b.dataset.rm,
      ruling: same ? null : b.dataset.rule, note,   // clicking the set ruling clears it
    }).then(() => api("/api/rulings"));
    renderLabelRail(); renderRows();
  });
}

async function refreshProgress() { S.progress = await api("/api/progress"); renderProgress(); }
function renderProgress() {

    </div>
    <div class="card"><b>Batches</b> <span class="muted">(handout: 15 uniform, 15 cluster, 30 dimension, 25 depth, 15 final)</span>
      ${Object.keys(p.batches).length ? `<table style="margin-top:6px"><tr><th>batch</th><th>size</th><th>reviewed</th></tr>
        ${Object.entries(p.batches).map(([k, v]) => `<tr>
          <td>${esc(k)} <button class="small" data-rn="${esc(k)}" title="rename">✎</button></td>
          <td>${v.size}</td><td>${v.reviewed}</td></tr>`).join("")}</table>`
        : `<div class="muted">no sample_manifest.json batches yet</div>`}
    </div>
    <div class="card"><b>Modes</b>
      ${p.final_modes.length ? `<table style="margin-top:6px"><tr><th>mode</th><th>fail</th><th>pass</th><th>labeled</th></tr>
        ${p.final_modes.map(m => `<tr><td>${esc(m)}</td><td>${p.mode_counts[m].fail}</td><td>${p.mode_counts[m].pass}</td><td>${p.mode_counts[m].labeled}</td></tr>`).join("")}</table>`
        : `<div class="muted">no confirmed modes yet</div>`}
      ${p.draft_modes.length ? `<div class="muted" style="margin-top:6px">draft: ${p.draft_modes.map(esc).join(", ")}</div>` : ""}
    </div>
    <div class="card"><b>Incomplete judgments</b> <span class="muted">reviewed sessions missing a label for a confirmed mode</span>
      ${p.incomplete.length ? `<div style="max-height:260px;overflow:auto;margin-top:6px">${p.incomplete.map(i =>
        `<div style="border-bottom:1px solid var(--line);padding:4px 0"><a href="#" data-go="${i.session_id}">${esc(i.scenario_id)}</a>
          <span class="muted">${i.missing.map(m => m.trace_id.slice(0, 8) + ": " + m.modes.join(", ")).join(" · ")}</span></div>`).join("")}</div>`
        : `<div class="muted">none</div>`}
    </div>`;
  document.querySelectorAll("#progress [data-go]").forEach(a => a.onclick = e => {
    e.preventDefault(); show("review"); select(a.dataset.go);
  });
  document.querySelectorAll("#progress [data-rn]").forEach(b => b.onclick = async () => {
    const name = b.dataset.rn, next = prompt("Rename batch", name);
    if (!next || next === name) return;
    const err = await renameBatch(name, next);
    if (err) alert(err);
  });
}

/* --------------------------------------------------------- suggestions */
function renderSuggestions() {
  const pending = S.suggestions.filter(s => !s.decision), decided = S.suggestions.filter(s => s.decision);
  $("#suggestions").innerHTML = `
    <div class="card"><b>Agent suggestions</b>
      <div class="muted">Suggestions are proposals only. Accepting copies one into your annotations, marked as accepted; rejecting keeps the record for the handout’s “rejected suggestion”.</div>
      ${pending.length ? pending.map(s => `<div class="note suggestion" style="margin-top:8px">
          <b>${esc(s.suggested_mode || "(no mode)")}</b> · <span class="muted">${esc(s.scenario_id || "")}</span>
          <div class="quote">“${esc((s.quote || "").slice(0, 120))}”</div>
          <div>${esc(s.note || "")}</div>
          <div class="actions"><button class="small" data-acc="${s.suggestion_id}">accept</button>
            <button class="small" data-rej="${s.suggestion_id}">reject</button></div>
        </div>`).join("") : `<div class="muted" style="margin-top:8px">none pending</div>`}
    </div>
    ${decided.length ? `<div class="card"><b>Decided</b><table style="margin-top:6px"><tr><th>mode</th><th>scenario</th><th>decision</th></tr>
      ${decided.map(s => `<tr><td>${esc(s.suggested_mode || "")}</td><td>${esc(s.scenario_id || "")}</td><td>${esc(s.decision)}</td></tr>`).join("")}</table></div>` : ""}`;
  document.querySelectorAll("#suggestions [data-acc],#suggestions [data-rej]").forEach(b => b.onclick = async () => {
    const accept = b.hasAttribute("data-acc");
    await api("/api/suggestions/accept", {suggestion_id: accept ? b.dataset.acc : b.dataset.rej, decision: accept ? "accepted" : "rejected"});
    [S.suggestions, S.annotations] = await Promise.all([api("/api/suggestions"), api("/api/annotations").then(d => d.annotations)]);
    renderSuggestions(); renderNotes();
  });
}

/* -------------------------------------------------------------- views */
function syncUrl() {
  // Keep the address bar naming both the view and the conversation, so a refresh
  // (or a copied link) returns to the same place.
  try {
    const params = new URLSearchParams();
    if (S.view && S.view !== "review") params.set("view", S.view);
    if (S.session && S.session.scenario_id) params.set("scenario", S.session.scenario_id);
    const query = params.toString();
    history.replaceState(null, "", query ? `?${query}` : location.pathname);
  } catch (e) { /* sandboxed: the app still works, the URL just does not update */ }
}
function show(view) {
  S.view = view;
  // Review and Labeling share one workspace: same session list, same conversation
  // renderer, different right rail and different default filter.
  const workspace = view === "review" || view === "labeling" ? "review" : view;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  document.querySelectorAll("main").forEach(m => m.classList.toggle("active", m.id === workspace));
  if (view === "labeling" || view === "review") {
    // The filter is the reviewer's choice; a completed session stays in the list, the
    // way an annotated one does in Review.
    renderRows();
    renderRail();
  }
  if (view === "taxonomy") { renderTaxonomy(); renderAnnotationTable(); }
  if (view === "progress") refreshProgress();
  if (view === "suggestions") renderSuggestions();
  syncUrl();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.view));

document.addEventListener("keydown", e => {
  if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
  const rows = filtered(), i = rows.findIndex(r => r.session_id === S.current);
  if (e.key === "j" && i < rows.length - 1) select(rows[i + 1].session_id);
  if (e.key === "k" && i > 0) select(rows[i - 1].session_id);
  if (e.key === "e") { const d = $("#expected"); if (d) d.open = !d.open; }
});

boot().catch(err => {
  const el = $("#showing");
  if (el) el.textContent = "load failed — see console";
  console.error("boot failed:", err);
});
</script>
</body>
</html>
