name: monitor

on:
#  schedule:
#    - cron: "0 13 * * *"  # daily, 13:00 UTC
  workflow_dispatch:

jobs:
  monitor:
    name: judge the last 24 hours
    # Langfuse runs on localhost, so this needs a self-hosted runner (or a
    # LANGFUSE_HOST that a GitHub-hosted runner can reach).
    runs-on: self-hosted
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - name: Pull dependencies
        run: uv sync
      - name: Sample, judge, correct, and score the last 24 hours
        run: uv run python -m monitoring.run --last-hours 24
      - name: Upload monitoring output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-output
          path: monitoring/output/
          if-no-files-found: warn
